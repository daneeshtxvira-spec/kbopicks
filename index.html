<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO AI Predictor PRO</title><style>*{box-sizing:border-box}body{margin:0;background:#080d18;color:#fff;font-family:Arial}.wrap{max-width:950px;margin:auto;padding:18px}.card{background:#121a2b;border:1px solid #273552;border-radius:20px;padding:20px;margin-bottom:16px}.muted{color:#95a3bd}.teams{display:grid;grid-template-columns:1fr 1fr;gap:15px}.options{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.opt{padding:8px;border:1px solid #2b3958;border-radius:12px;text-align:center;background:#0c1424;cursor:pointer}.opt.selected{border-color:#60a5fa;background:#182c4d}.opt img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}.opt span{display:block;font-size:11px;margin-top:5px}button{width:100%;padding:15px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:bold;font-size:16px;margin-top:15px}.grid,.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input{width:100%;padding:12px;background:#0a1220;color:#fff;border:1px solid #2b3958;border-radius:10px}.result{display:none}.winner{font-size:28px;font-weight:bold}.stats{grid-template-columns:repeat(4,1fr)}.stat{background:#0a1220;border-radius:12px;padding:13px}.num{font-size:23px;font-weight:bold;margin-top:4px}.bar{height:12px;background:#27344e;border-radius:8px;overflow:hidden}.fill{height:100%;background:#4ade80}@media(max-width:700px){.options{grid-template-columns:repeat(2,1fr)}.teams,.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="card"><h1>🇰🇷 KBO AI Predictor PRO</h1><p class="muted">Selecciona los equipos por escudo y calcula ganador, marcador y Over/Under.</p><span id="updated"></span></div><div class="teams"><div class="card"><h3>🏠 LOCAL</h3><div id="home" class="options"></div></div><div class="card"><h3>✈️ VISITANTE</h3><div id="away" class="options"></div></div></div><div class="card"><label>Línea O/U</label><input id="line" type="number" step=".5" value="8.5"><button onclick="predict()">🤖 ANALIZAR PARTIDO</button></div><div id="result" class="card result"><div id="winner" class="winner"></div><p id="score"></p><div class="stats"><div class="stat">Ganador<div id="wp" class="num"></div></div><div class="stat">Total<div id="total" class="num"></div></div><div class="stat">Over<div id="over" class="num"></div></div><div class="stat">Under<div id="under" class="num"></div></div></div><br><div class="bar"><div id="fill" class="fill"></div></div><p id="why" class="muted"></p></div></div><script>let teams=[],stats={},home='KT',away='SAMSUNG';Promise.all([fetch('data/teams.json').then(r=>r.json()),fetch('data/kbo.json').then(r=>r.json())]).then(([t,d])=>{teams=t;stats=d.teams;document.getElementById('updated').textContent='Datos: '+d.updated+' • Fuente: '+d.source;draw('home',home);draw('away',away)});function draw(id,sel){document.getElementById(id).innerHTML=teams.map(t=>`<div class="opt ${t.id===sel?'selected':''}" onclick="pick('${id}','${t.id}')"><img src="${t.logo}" onerror="this.style.visibility='hidden'"><span>${t.name}</span></div>`).join('')}function pick(id,v){if(id==='home')home=v;else away=v;draw('home',home);draw('away',away)}function sig(x){return 1/(1+Math.exp(-x))}function predict(){if(home===away)return alert('Selecciona dos equipos diferentes.');let H=stats[home],A=stats[away],line=+document.getElementById('line').value||8.5;let h=(H.runs/141)*.58+(A.allowed/141)*.42+(H.recent10/10)*.28+.18,a=(A.runs/141)*.58+(H.allowed/141)*.42+(A.recent10/10)*.28,total=h+a,d=(h-a)+(H.wins-A.wins)/35,wp=sig(d*3.1)*100,winner=wp>=50?home:away,win=winner===home?wp:100-wp,over=100/(1+Math.exp((line-total)*1.08));document.getElementById('winner').textContent='🏆 '+teams.find(x=>x.id===winner).name+' • '+win.toFixed(1)+'%';document.getElementById('score').textContent=`Marcador proyectado: ${teams.find(x=>x.id===home).name} ${h.toFixed(1)} — ${a.toFixed(1)} ${teams.find(x=>x.id===away).name}`;document.getElementById('wp').textContent=win.toFixed(1)+'%';document.getElementById('total').textContent=total.toFixed(1);document.getElementById('over').textContent=over.toFixed(1)+'%';document.getElementById('under').textContent=(100-over).toFixed(1)+'%';document.getElementById('fill').style.width=win+'%';document.getElementById('why').textContent='Ataque + carreras permitidas + récord + forma reciente + ventaja de local.';document.getElementById('result').style.display='block'}</script></body></html>
